name: cast_screen_mirroring
description: Cast media to compatible TVs with AirPlay guidance and honest iOS mirroring limits.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  webview_flutter: ^4.13.0
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B6BCB"
  image: assets/branding/splash_mark.png
  branding: assets/branding/splash_branding.png
  branding_bottom_padding: 48
  android: true
  ios: true
  android_12:
    color: "#0B6BCB"
    image: assets/branding/splash_mark.png
    branding: assets/branding/splash_branding.png
